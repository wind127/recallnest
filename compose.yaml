services:
  recallnest:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - RECALLNEST_DATA_DIR=/data
      - RECALLNEST_BASE_URL
      - RECALLNEST_CHAT_MODEL
      - RECALLNEST_API_KEY
      - RECALLNEST_EMBEDDING_MODEL
      - RECALLNEST_MAX_UPLOAD_BYTES
      - RECALLNEST_MAX_ZIP_BYTES
      - RECALLNEST_MAX_ZIP_MEMBERS
    volumes:
      - recallnest-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  recallnest-data:
