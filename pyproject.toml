[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recallnest"
version = "0.1.0"
description = "Local, evidence-backed personal knowledge and memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RecallNest contributors"}]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.20", "uvicorn>=0.30,<1", "mcp==2.3.0", "psutil>=7.0,<8"]

[project.scripts]
recallnest = "recallnest.cli:main"

[project.urls]
Homepage = "https://github.com/wind127/recallnest"
Repository = "https://github.com/wind127/recallnest"
Issues = "https://github.com/wind127/recallnest/issues"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recallnest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
